<header class="h-16 bg-[#1E2026] border-b border-[#2A2D36] flex items-center justify-between px-6 shadow-sm z-10 w-full">
  <div class="flex items-center gap-4">
    <!-- Restaurant Logo -->
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-[#C8A27A] flex items-center justify-center text-[#121316] font-bold text-xl">
        R
      </div>
      <span class="text-gray-100 font-['Outfit'] text-lg font-semibold tracking-wide">Restaurant<span class="text-[#C8A27A]">Manager</span></span>
    </div>
  </div>

  <div class="flex items-center gap-6">
    <!-- User Info -->
    <div class="flex flex-col items-end hidden md:flex">
      <span class="text-gray-100 font-['Inter'] text-sm font-medium">{{ (userName$ | async) }}</span>
      <span class="text-[#C8A27A] font-['Inter'] text-xs font-semibold tracking-wider">
        {{ (userRole$ | async) === 'WAITER' ? 'Garçom' : ((userRole$ | async) === 'MANAGER' ? 'Gerente' : 'Admin') }}
      </span>
    </div>

    <!-- Divider -->
    <div class="h-8 w-px bg-[#2A2D36] hidden md:block"></div>

    <!-- Logout Button -->
    <button (click)="logout()" class="text-gray-400 hover:text-red-400 transition-colors duration-200 focus:outline-none flex items-center gap-2" aria-label="Sair">
      <span class="hidden md:block font-['Inter'] text-sm font-medium">Sair</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
      </svg>
    </button>
  </div>
</header>
