<div class="min-h-screen flex items-center justify-center bg-[#121316] p-4">
  <div class="w-full max-w-md bg-[#1E2026] rounded-xl shadow-2xl overflow-hidden border border-[#2A2D36]">
    <div class="p-8">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-100 font-['Outfit']">RestôManager</h2>
        <p class="text-gray-400 mt-2 font-['Inter']">Entre para acessar sua conta</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="p-3 bg-red-950/60 border border-red-500/50 rounded-lg text-red-400 text-sm">
          {{ errorMessage }}
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-300 mb-2 font-['Inter']">E-mail</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="w-full px-4 py-3 bg-[#121316] border border-[#2A2D36] rounded-lg focus:outline-none focus:border-[#C8A27A] focus:ring-1 focus:ring-[#C8A27A] text-gray-100 transition-colors"
            placeholder="seu@email.com"
          >
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-red-400 text-xs mt-1">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">E-mail é obrigatório</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">E-mail inválido</span>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-2 font-['Inter']">Senha</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="w-full px-4 py-3 bg-[#121316] border border-[#2A2D36] rounded-lg focus:outline-none focus:border-[#C8A27A] focus:ring-1 focus:ring-[#C8A27A] text-gray-100 transition-colors"
            placeholder="••••••••"
          >
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-400 text-xs mt-1">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Senha é obrigatória</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="w-full bg-[#C8A27A] hover:bg-[#B38E68] text-white font-semibold py-3 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-[#C8A27A] focus:ring-offset-2 focus:ring-offset-[#121316] disabled:opacity-50 disabled:cursor-not-allowed font-['Inter'] mt-4"
        >
          <span *ngIf="!isLoading">Entrar</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Entrando...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
